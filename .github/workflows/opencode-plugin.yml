name: OpenCode Desktop plugin
on:
  push:
    branches: [main]
    paths: ["clients/opencode-desktop/**", "scripts/*publication.py", ".github/workflows/opencode-plugin.yml"]
  pull_request:
    paths: ["clients/opencode-desktop/**", "scripts/*publication.py", ".github/workflows/opencode-plugin.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/opencode-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/opencode-desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 ../../scripts/test-publication.py
